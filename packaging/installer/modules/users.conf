userGroup: users
defaultGroups: [ sudo, audio, video, plugdev, netdev, bluetooth ]
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
allowWeakPasswords: false
passwordRequirements:
  minLength: 8
user:
  shell: /bin/bash
  forbidden_names: [ root, padtv ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: padtv
