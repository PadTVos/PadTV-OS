---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
dont-chroot: false
prompt-install: true
branding: padtv
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - packages
      - padtv-finalize
      - grubcfg
      - initramfs
      - bootloader
      - umount
  - show: [ finished ]
