name: PadTV tests and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3 python3-pyqt6 dpkg-dev shellcheck
      - uses: actions/checkout@v4
      - run: QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests -v
      - run: bash scripts/build-deb.sh
      - run: shellcheck scripts/build-deb.sh scripts/build-iso.sh
