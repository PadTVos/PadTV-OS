label live-amd64
    menu label PadTV 0.8 - Android Runtime Integration
    menu default
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components persistence noeject quiet splash loglevel=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 username=padtv hostname=padtv locales=cs_CZ.UTF-8 keyboard-layouts=cz timezone=Europe/Prague

label live-diagnostic
    menu label PadTV - diagnostika
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components persistence noeject username=padtv hostname=padtv locales=cs_CZ.UTF-8 keyboard-layouts=cz timezone=Europe/Prague
