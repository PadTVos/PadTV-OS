source /boot/grub/config.cfg
menuentry "PadTV 0.5 - Android Runtime" {
    linux /live/vmlinuz boot=live components persistence noeject quiet splash loglevel=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 username=padtv hostname=padtv locales=cs_CZ.UTF-8 keyboard-layouts=cz timezone=Europe/Prague findiso=${iso_path}
    initrd /live/initrd.img
}
menuentry "PadTV - diagnostika" {
    linux /live/vmlinuz boot=live components persistence noeject username=padtv hostname=padtv locales=cs_CZ.UTF-8 keyboard-layouts=cz timezone=Europe/Prague findiso=${iso_path}
    initrd /live/initrd.img
}
if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI nastaveni" { fwsetup }
fi
